appId: com.vednovaitsolution.invoicemanager
productName: Invoice Manager

directories:
  output: release

files:
  - .next/**/*
  - public/**/*
  - electron/**/*
  - server/**/*
  - package.json
  - .env.server
  - .env.server.example

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

asar: true

asarUnpack:
  - ".next/standalone/**/*"
  - "server/**/*"
  - ".env.server"

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: ronakbhalara8-cmyk
  repo: invoice-desktop-live